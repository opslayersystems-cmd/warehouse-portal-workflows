[project]
name = "warehouse-portal-gtm"
version = "0.1.0"
description = "Savannah B2B prospect research and human review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "openai>=1.60",
  "openai-agents>=0.2",
  "httpx>=0.27",
  "typer>=0.12",
  "structlog>=24.2",
  "itsdangerous>=2.2",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
warehouse-portal = "warehouse_portal.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_portal"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".python", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
