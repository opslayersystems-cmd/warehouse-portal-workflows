<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Warehouse Portal — Core Workflows</title>
  <style>
    :root { --surface: #f8fafc; --ink: #0f172a; --muted: #475569; --border: #cbd5e1; --selected: #e0f2fe; --accent: #0369a1; }
    :root[data-theme="dark"] { --surface: #020617; --ink: #f8fafc; --muted: #cbd5e1; --border: #334155; --selected: #0c4a6e; --accent: #7dd3fc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); color: var(--ink); font-family: system-ui, sans-serif; }
    .language-bar { height: 64px; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); }
    .language-label { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); }
    .language-nav { display: flex; gap: 8px; }
    .language-nav a { display: inline-flex; align-items: center; justify-content: center; min-width: 88px; min-height: 44px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--ink); background: var(--surface); font-size: 14px; font-weight: 600; text-decoration: none; }
    .language-nav a[aria-current="page"] { background: var(--selected); border-color: var(--accent); color: var(--accent); }
    .language-nav a:hover { border-color: var(--accent); }
    .language-nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #workflow-view { display: block; width: 100%; height: calc(100vh - 64px); height: calc(100dvh - 64px); border: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 480px) { .language-bar { padding-inline: 12px; gap: 8px; } .language-nav a { min-width: 76px; padding-inline: 10px; } }
  </style>
</head>
<body>
  <header class="language-bar">
    <p class="language-label" id="language-label">Diagram language</p>
    <nav class="language-nav" aria-label="Diagram language" id="language-nav">
      <a href="#en" lang="en" hreflang="en" data-language="en" aria-current="page">English</a>
      <a href="#ka" lang="ka" hreflang="ka" data-language="ka">ქართული</a>
    </nav>
    <span class="sr-only" id="language-status" role="status" aria-live="polite"></span>
  </header>
  <main>
    <iframe id="workflow-view" src="en.html" data-language="en" title="Warehouse Portal workflow diagram in English" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
    <noscript><p>Open the <a href="en.html">English diagram</a> or <a href="ka.html" lang="ka">ქართული დიაგრამა</a>.</p></noscript>
  </main>
  <script>
    (() => {
      'use strict';
      const frame = document.getElementById('workflow-view');
      const links = [...document.querySelectorAll('[data-language]')].filter(node => node.tagName === 'A');
      const copy = {
        en: { file: 'en.html', title: 'Warehouse Portal — Core Workflows', label: 'Diagram language', frame: 'Warehouse Portal workflow diagram in English', status: 'English diagram loaded' },
        ka: { file: 'ka.html', title: 'Warehouse Portal — ძირითადი სამუშაო ნაკადები', label: 'დიაგრამის ენა', frame: 'Warehouse Portal-ის სამუშაო ნაკადების დიაგრამა ქართულად', status: 'ქართული დიაგრამა ჩაიტვირთა' }
      };
      let themeObserver;
      function selectLanguage() {
        const language = location.hash === '#ka' ? 'ka' : 'en';
        const text = copy[language];
        document.documentElement.lang = language;
        document.title = text.title;
        document.getElementById('language-label').textContent = text.label;
        document.getElementById('language-nav').setAttribute('aria-label', text.label);
        links.forEach(link => {
          if (link.dataset.language === language) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        frame.title = text.frame;
        if (frame.dataset.language !== language) {
          document.getElementById('language-status').textContent = '';
          frame.dataset.language = language;
          // Keep one browser-history entry per language choice, not a second iframe entry.
          frame.contentWindow.location.replace(text.file);
        }
      }
      frame.addEventListener('load', () => {
        if (themeObserver) themeObserver.disconnect();
        const child = frame.contentDocument && frame.contentDocument.documentElement;
        if (child) {
          const syncTheme = () => { document.documentElement.dataset.theme = child.dataset.theme === 'dark' ? 'dark' : 'light'; };
          syncTheme();
          themeObserver = new MutationObserver(syncTheme);
          themeObserver.observe(child, { attributes: true, attributeFilter: ['data-theme'] });
        }
        document.getElementById('language-status').textContent = copy[frame.dataset.language].status;
      });
      window.addEventListener('hashchange', selectLanguage);
      selectLanguage();
    })();
  </script>
</body>
</html>
