<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Warehouse Portal GTM</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
  <main class="login-card panel">
    <p class="eyebrow">Warehouse Portal GTM</p>
    <h1>Operator sign in</h1>
    <p class="muted">Use the local account created by an administrator.</p>
    {% if error %}<p class="notice" role="alert">Invalid username or password.</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">Sign in</button>
    </form>
    {% if google_ready %}<p class="login-separator">or</p><a class="button" href="/auth/google/start">Sign in with Google</a>{% endif %}
  </main>
</body>
</html>
